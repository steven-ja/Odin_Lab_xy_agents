[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xy-agents"
version = "0.0.1"
description = "Read-only, governed financial-advisory analysis with Streamlit and LangGraph"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "pydantic>=2.5", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50,<2", "langgraph>=0.6,<2", "graphviz>=0.20", "altair>=6,<7"]
local = ["transformers==5.17.0", "torch>=2.4", "sentencepiece>=0.2", "huggingface-hub>=1,<2", "accelerate>=1", "torchvision", "pillow", "opencv-python-headless"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
